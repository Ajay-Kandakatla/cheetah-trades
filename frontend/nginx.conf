server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── OAuth2 proxy plumbing ────────────────────────────────────────────
    # /oauth2/* routes go to oauth2-proxy directly. These MUST NOT require
    # auth themselves (they ARE the auth flow).
    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # Internal endpoint used by `auth_request` directives below.
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # When auth check fails, send the user to /oauth2/sign_in with a return URL.
    location @oauth2_signin {
        return 302 /oauth2/sign_in?rd=$scheme://$host$request_uri;
    }

    # ── Static SPA — gated by Google login ──────────────────────────────
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;

        # Make the authenticated user's email visible to the SPA.
        auth_request_set $auth_user $upstream_http_x_auth_request_email;
        add_header X-User-Email $auth_user always;

        try_files $uri $uri/ /index.html;
    }

    # See nginx-oauth.conf for the full rationale. Mirrored here so the
    # two configs don't drift.
    location = /index.html {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }
    location ~* \.(js|css|woff2?|svg|png|jpg|webp)$ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ── /api/* — same auth, also injects X-User-Email into the request ──
    location /api/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;

        auth_request_set $auth_user $upstream_http_x_auth_request_email;
        # Forward Google's access token so the backend can fetch the user's
        # display name + picture on first /auth/me call. Cached after that.
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;
        proxy_set_header X-User-Email $auth_user;
        proxy_set_header X-Access-Token $auth_token;

        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /ws {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;

        auth_request_set $auth_user $upstream_http_x_auth_request_email;
        proxy_set_header X-User-Email $auth_user;

        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
