<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pounce — wait, then strike</title>

    <!-- Browser tab favicon — gold italic "P" on dark background.
         SVG renders crisp at every zoom level and every device pixel
         ratio. Modern Chrome / Firefox / Safari (iOS 12+ / macOS 11+)
         all support SVG favicons natively. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/icon.svg" />

    <!-- PWA — required for iOS Safari Web Push (must be installed to home screen first) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#b87900" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pounce" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Plaid Link JS SDK — provides window.Plaid.create() used by the
         /portfolio page's Connect Brokerage flow. react-plaid-link (npm)
         does NOT bundle this; the imperative Plaid.create() API is only
         available via Plaid's hosted CDN. ~30 KB gzipped. -->
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
