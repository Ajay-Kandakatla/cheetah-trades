R3ZWV0OjE4ODQ5MzQ1OTU1NTgxNjY1Mjg=\",\"rest_id\":\"1884934595558166528\",\"text\":\"Martin Luk (@martinlukkt) returned +283% in @USICOfficial 2024.\\n\\nAn impressive performance for anyone, and certainly for a 22-year-old who’s 4 years into his trading journey!\\n\\nAlong the way, he’s learnt many lessons.\\n\\nJust sharing the lessons is one thing. Telling them through his stories and experiences hits 10x harder.\\n\\n(Personally, I think Martin is a natural storyteller and a remarkable young man.)\\n\\n***\\n\\n“Two bad months ruined my whole year [2022].”\\n\\n“In late May [2023], I realised +80% on a trade in $CVNA, setting a new all-time high in my P&L. This was my ‘aha’ moment in trading. I realised my trading can actually make progress. This gave me confidence and I slowly developed sit-out power.”\\n\\n“Setting tighter stops has two big benefits: 1. Limited psychological barrier to taking and accepting losses. This means I can disregard losses and seek re-entry right after getting stopped out. […] 2. A tighter stop can exponentially improve risk–reward.”\\n\\n“When you tighten your stop by 50%, R also increases by 50%. But the higher the return, the larger the absolute increase in R. By tightening your stop from 3% to 1.5%, you can gain an 8.34R advantage on a trade with a 25% return, and a 25R advantage on a trade with a 75% return.”\\n\\n“I focused too much on the instant impact and failed to think about long-term growth. One day, I was daydreaming, trying to imagine how my trading would look after 10 or 20 years. I suddenly realised that if I truly want to become consistently profitable, trade for the rest of my life, and manage a much larger account, I cannot make those simple mistakes and ruin my account again.”\\n\\n“If I keep overtrading now, I will still overtrade in the future, no matter how experienced I become or how big my account grows. In that moment, I shifted my focus from short-term to long-term, and the urge to overtrade went away.”\\n\\n“Knowing how hard it’d be to recover from a huge drawdown again, and seeing the many random trades in my journal I could’ve easily avoided, I told myself I couldn’t afford to trip over the same stone twice. So, I reduced my position sizes and started small (progressive exposure). The result was consecutive best-performing months that significantly contributed to my outperformance last year.”\\n\\n“It takes hundreds or thousands of trades to get rich, and only one trade to go bust.”\\n\\n***\\n\\nI can’t tell you how excited I am for this one:\\n\\nThe 22-Year-Old Who Returned 283% in USIC 2024\\nMartin Luk’s key lessons from 2024 and his journey to date\\n🔗 https://t.co/tBqrZLWhl8\"}}},\"rest_id\":\"1884934595868610676\",\"url_entities\":[],\"views\":{\"count\":\"333877\"}}},\"rest_id\":\"1884936964673282274\",\"url_entities\":[],\"views\":{\"count\":\"208936\"}}}}},\"entry_id\":\"tweet-1884936964673282274\",\"sort_index\":\"2113248471858282496\"}},{\"__typename\":\"TimelineAddEntries\",\"entries\":[{\"content\":{\"__typename\":\"TimelineTimelineItem\",\"client_event_info\":{\"component\":\"organic_tweets\",\"element\":\"tweet\"},\"content\":{\"__isTimelineTimelineItemContent\":\"TimelineTweet\",\"__typename\":\"TimelineTweet\",\"display_type\":\"Tweet\",\"tweet_results\":{\"id\":\"VHdlZXRSZXN1bHRzOjIxMDgxNzU0NjM5MjM1NDgyNjU=\",\"rest_id\":\"2108175463923548265\",\"result\":{\"__isTweetResult\":\"Tweet\",\"__typename\":\"Tweet\",\"cashtag_attachments\":[],\"core\":{\"user_results\":{\"id\":\"VXNlclJlc3VsdHM6ODU5NzUyMzE4NjY0NzE2Mjg4\",\"result\":{\"__typename\":\"User\",\"avatar\":{\"image_url\":\"https://pbs.twimg.com/profile_images/1884931481434492928/PY3NKXhR_normal.jpg\"},\"core\":{\"name\":\"Martin Luk\",\"screen_name\":\"martinlukkt\"},\"id\":\"VXNlcjo4NTk3NTIzMTg2NjQ3MTYyODg=\",\"identity_profile_labels_highlighted_label\":{},\"location\":{\"location\":\"Hong Kong\"},\"privacy\":{\"protected\":false},\"profile_bio\":{\"description\":\"Trader | +969% in US Inves
